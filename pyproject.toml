[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-finder"
version = "1.0.0"
description = "APT-Finder: Japanese apartment scraping and commute analysis"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "APT-Finder contributors" }]
keywords = ["apartment", "scraper", "fastapi", "react", "sqlite", "japan"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.1.0",
  "pyyaml>=6.0.1",
  "googlemaps>=4.10.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.2.0",
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "pydantic>=2.4.0",
  "tzdata>=2024.1",
  "jageocoder>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[project.scripts]
apt-finder = "main:main"
apt-api = "run_api:main"

[tool.setuptools]
include-package-data = true
py-modules = ["main", "run_api"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.database" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["otp-routing", "docs/scrape", "web/node_modules", "web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
